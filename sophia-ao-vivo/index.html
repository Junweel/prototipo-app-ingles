<title>Sophia ao vivo · São Paulo Languages Academy</title>
<style>
:root{--navy:#0B1119;--navy2:#1E2631;--cream:#F3EBDD;--paper:#FAF7F1;--yellow:#F5C518;--red:#C8102E;--green:#1E8E4E;--ink:#1b1f26}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--ink);display:flex;flex-direction:column;align-items:center}
header{width:100%;background:var(--navy);color:var(--paper);padding:10px 14px;display:flex;align-items:center;gap:10px}
header b{font-size:16px}header small{opacity:.7;font-size:12px}header .sp{flex:1}
header a,header button{color:var(--paper);background:none;border:1px solid #fff4;border-radius:8px;padding:5px 9px;font-size:13px;text-decoration:none;cursor:pointer}
main{width:100%;max-width:520px;flex:1;display:flex;flex-direction:column;padding:10px;gap:8px;min-height:0}
#stage{position:relative;width:100%;aspect-ratio:1/1;max-height:46vh;background:var(--paper);border-radius:18px;overflow:hidden;border:3px solid var(--navy);margin:0 auto}
#stage svg{width:100%;height:100%;display:block}
#pill{position:absolute;top:10px;left:10px;background:var(--navy);color:#fff;font-size:13px;padding:5px 10px;border-radius:99px;display:flex;gap:6px;align-items:center}
#pill i{width:9px;height:9px;border-radius:50%;background:#888;display:inline-block}
#hmm{position:absolute;top:18%;right:8%;background:#fff;border:2px solid var(--navy);border-radius:14px;padding:4px 10px;font-weight:600;opacity:0;transition:opacity .2s}
#meter{position:absolute;bottom:8px;left:10px;right:10px;height:5px;background:#0002;border-radius:3px;overflow:hidden}
#meter div{height:100%;width:0;background:var(--yellow)}
#caption{min-height:44px;background:#fff;border-radius:12px;padding:8px 12px;font-size:16px;border:1px solid #0001}
#caption .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.55;display:block}
#caption .interim{opacity:.55}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:90px;padding:2px}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:15px;line-height:1.35}
.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.so{align-self:flex-start;background:#fff;border:1px solid #0001;border-bottom-left-radius:4px}
.so .pt{display:block;font-size:12px;opacity:.6;margin-top:3px}
.tip{align-self:flex-start;background:#FFF6D6;border:1px solid #E8D58A;border-radius:12px;padding:8px 11px;font-size:14px;max-width:92%}
.tip b{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#7a6200;display:block}
.rep{align-self:flex-start;background:#fff;border:2px dashed var(--navy);border-radius:12px;padding:8px 11px;font-size:17px;max-width:92%}
.rep b{font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:block;opacity:.65}
.rep span{transition:color .3s}.rep span.ok{color:var(--green);font-weight:700}
.rep .done{color:var(--green);font-size:13px;display:block}
.emph{background:#FFF0B3;border-radius:4px;padding:0 2px;font-weight:600}
#controls{display:flex;gap:8px;flex-wrap:wrap}
#btnTalk{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;min-height:64px;font-size:19px}
#btnTalk.held{background:var(--green);color:#fff;box-shadow:0 0 0 4px #1E8E4E55}
button.big{flex:1;font-size:17px;padding:12px;border-radius:12px;border:0;background:var(--yellow);color:var(--navy);font-weight:700;cursor:pointer}
button.sec{font-size:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--navy);background:#fff;cursor:pointer}
#typeRow{display:flex;gap:6px}#typeRow input{flex:1;padding:10px;border-radius:10px;border:1px solid #0003;font-size:15px}
dialog{border:0;border-radius:16px;max-width:460px;width:94%;padding:16px}
dialog label{display:block;font-size:13px;margin:10px 0 3px;font-weight:600}
dialog input,dialog select{width:100%;padding:8px;border-radius:8px;border:1px solid #0003;font-size:14px}
dialog p{font-size:12.5px;opacity:.8;margin:4px 0}
.modes{display:flex;gap:6px;font-size:13px;align-items:center}
.modes select{padding:6px;border-radius:8px}
#err{color:#7a4a00;font-size:13px}
#diag{font:11.5px/1.3 ui-monospace,monospace;background:#0B1119;color:#cfe;padding:5px 8px;border-radius:8px;word-break:break-word}
#azTestOut,#aiTestOut{font-size:12.5px;margin-top:4px}
.me .heard{display:block;margin-top:5px;padding-top:4px;border-top:1px solid #fff3;font-size:14px;font-weight:600;color:#BFF5CF}
</style></head>

<header><b>Sophia ao vivo</b><span class="sp"></span><a href="../">Protótipo</a><button id="btnCfg">⚙︎ Ajustes</button></header>

 <div id="stage"><div id="svgHost"></div><div id="pill"><i></i><span id="pillTxt">Pronta</span></div><div id="hmm">Hmm…</div><div id="meter"><div></div></div></div>

<script>
"use strict";
/* ============ 0 · RIG DA SOPHIA (a partir de chars.js v4, separado em grupos com pivôs) ============ */
const SK='#EBC09D',SKD='#CF9A77',HAIR='#38200F',HH='#5E3A22',LID='#2A1810';
function sophiaRig(){
 const face='M45 55 Q45 34 60 34 Q75 34 75 55 Q75 70 68.5 78 Q60 85 51.5 78 Q45 70 45 55Z';
 const eye=(cx,side)=>`<clipPath id="eyeclip${side}"><path d="M${cx-3.5} 56.2 Q${cx} 53.6 ${cx+3.5} 56.2 Q${cx} 58.6 ${cx-3.5} 56.2Z"/></clipPath>
  <g clip-path="url(#eyeclip${side})"><rect x="${cx-4}" y="52" width="8" height="8" fill="#fff"/>
   <g id="iris${side}"><circle cx="${cx}" cy="56.2" r="1.95" fill="#6B3E22"/><circle cx="${cx}" cy="56.2" r=".95" fill="#120B07"/><circle cx="${cx+.7}" cy="55.5" r=".55" fill="#fff"/></g>
   <rect id="lid${side}" x="${cx-4}" y="48" width="8" height="5" fill="${SK}"/></g>`;
 return `<svg viewBox="10 12 100 112" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg" aria-label="Sophia, tutora (personagem ilustrada e fictícia)">
 <defs><pattern id="piso" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 8 Q4 0 8 8 T16 8" stroke="#0B1119" stroke-opacity=".05" fill="none" stroke-width="1.6"/></pattern></defs>
 <rect x="0" y="0" width="120" height="130" fill="#F3EBDD"/><rect x="0" y="0" width="120" height="130" fill="url(#piso)"/>
 <circle cx="96" cy="30" r="9" fill="#F5C518" opacity=".55"/><path d="M12 40 L24 28 L24 40Z" fill="#C8102E" opacity=".35"/>
 <g id="body" style="transform-origin:60px 124px">
  <g id="hairBack" style="transform-origin:60px 90px"><path d="M60 21 C38 21 30 37 32 55 C33 64 27 70 30 79 C33 88 26 95 30 106 C31 110 30 116 31 126 L89 126 C90 116 89 110 90 106 C94 95 87 88 90 79 C93 70 87 64 88 55 C90 37 82 21 60 21Z" fill="${HAIR}"/></g>
  <g id="torso" style="transform-origin:60px 124px">
   <path d="M18 126 C20 106 34 97 50 95 L70 95 C86 97 100 106 102 126Z" fill="${SK}"/>
   <path d="M24 126 C26 109 35 101 46 99 Q60 107 74 99 C85 101 94 109 96 126Z" fill="#F5C518"/>
   <path d="M46 99 Q60 107 74 99" stroke="#D9A90C" stroke-width="2.2" fill="none"/>
   <path d="M34 126 L36 112 M86 126 L84 112" stroke="#D9A90C" stroke-width="1.2" stroke-linecap="round"/>
   <path d="M53.5 74 L66.5 74 L67.5 92 Q60 96 52.5 92Z" fill="${SK}"/><path d="M53.5 79 Q60 84.5 66.5 79 L66.5 75 L53.5 75Z" fill="${SKD}" opacity=".55"/>
   <path d="M53 92 Q60 99.5 67 92" stroke="#B88A2A" stroke-width=".8" fill="none"/><path d="M60 98.2 l1.4 1.9 l-1.4 1.9 l-1.4 -1.9Z" fill="#B88A2A"/>
  </g>
  <g id="head" style="transform-origin:60px 80px">
   <ellipse cx="45" cy="58" rx="3.2" ry="4.8" fill="${SK}"/><ellipse cx="75" cy="58" rx="3.2" ry="4.8" fill="${SK}"/>
   <path d="M44.6 56 Q43.4 58 44.8 60.5 M75.4 56 Q76.6 58 75.2 60.5" stroke="${SKD}" stroke-width=".8" fill="none"/>
   <path d="${face}" fill="${SK}"/>
   <path d="M55 27 C42 28 37 39 37.5 55 C37.6 63 36 70 38 77 C41 68 42.5 58 45 50 C47.5 41 51 33 55 27Z" fill="${HAIR}"/>
   <path d="M55 27 C70 25 82 33 82.5 52 C82.8 62 84.5 69 82 77 C78 67 77 56 73.5 48 C69.5 39 62 33 55 27Z" fill="${HAIR}"/>
   <path d="M57 28 C66 27.5 74 31.5 78 39" stroke="${HH}" stroke-width="1.7" fill="none" stroke-linecap="round"/>
   <path d="M81 66 C86 76 80 86 85 98 C78 94 74.5 85 77 75Z" fill="${HAIR}"/>
   <g transform="rotate(-6 60 26)"><rect x="43.5" y="22.5" width="14" height="8.4" rx="4" fill="#0B1119"/><rect x="62.5" y="22.5" width="14" height="8.4" rx="4" fill="#0B1119"/><path d="M57.5 25.6 Q60 24 62.5 25.6" stroke="#0B1119" stroke-width="1.6" fill="none"/><path d="M46 24.6 L49.5 24.6 M65 24.6 L68.5 24.6" stroke="#5A616B" stroke-width="1.1" stroke-linecap="round"/></g>
   <g id="eyes">${eye(53.1,'L')}${eye(66.9,'R')}
    <path d="M49.2 56.1 Q53 52.8 56.8 55.8 M63.2 55.8 Q67 52.8 70.8 56.1" stroke="${LID}" stroke-width="1.15" fill="none" stroke-linecap="round" id="lashline"/></g>
   <path id="browL" d="M49 51 Q53 48.4 57 50.2" stroke="${LID}" stroke-width="1.5" fill="none" stroke-linecap="round" style="transform-origin:53px 50px"/>
   <path id="browR" d="M63 50.2 Q67 48.4 71 51" stroke="${LID}" stroke-width="1.5" fill="none" stroke-linecap="round" style="transform-origin:67px 50px"/>
   <path d="M60.4 58 Q59 63.6 60.2 64.6 Q61.4 65 62.4 64.2" stroke="${SKD}" stroke-width="1.1" fill="none" stroke-linecap="round"/>
   <ellipse id="blushL" cx="50" cy="64" rx="3" ry="1.6" fill="#E08A7A" opacity="0"/><ellipse id="blushR" cx="70" cy="64" rx="3" ry="1.6" fill="#E08A7A" opacity="0"/>
   <g id="mouth"><path id="mOuter" fill="#B0453F"/><path id="mInner" fill="#5A1A1A"/><path id="mTeeth" fill="#fff"/><path id="mTongue" fill="#D86A63"/></g>
  </g>
 </g></svg>`;
}
document.getElementById('svgHost').innerHTML=sophiaRig();
const $=id=>document.getElementById(id);
const R={body:$('body'),torso:$('torso'),head:$('head'),hairBack:$('hairBack'),irisL:$('irisL'),irisR:$('irisR'),lidL:$('lidL'),lidR:$('lidR'),browL:$('browL'),browR:$('browR'),mO:$('mOuter'),mI:$('mInner'),mT:$('mTeeth'),mTo:$('mTongue'),blL:$('blushL'),blR:$('blushR')};

/* Visemas: forma da boca = {open (abertura), wide (largura), round (bico), teeth, tongue} */
const VIS={
 rest:{o:0,w:6,r:0,t:0}, MBP:{o:0,w:5.4,r:0,t:0}, AA:{o:3.6,w:6.2,r:0,t:1}, E:{o:2.2,w:6.8,r:0,t:1},
 I:{o:1.4,w:7.2,r:0,t:1}, O:{o:3,w:4.2,r:.7,t:0}, U:{o:1.6,w:3.4,r:1,t:0}, FV:{o:.8,w:6,r:0,t:1},
 L:{o:2,w:5.6,r:0,t:1,tg:1}, TH:{o:1.2,w:5.8,r:0,t:1,tg:1}, S:{o:.7,w:6.6,r:0,t:1}, WR:{o:1.4,w:4,r:.8,t:0}, hum:{o:0,w:5,r:.2,t:0}
};
function drawMouth(m,smile){
 const cx=60,cy=70.6,w=m.w,o=m.o,cu=smile*1.6; // cantos sobem com o sorriso
 const top=cy-o*.35-.4, bot=cy+o+.9+smile*.6;
 R.mO.setAttribute('d',`M${cx-w} ${cy-cu} Q${cx-w*.5} ${top-.8} ${cx} ${top} Q${cx+w*.5} ${top-.8} ${cx+w} ${cy-cu} Q${cx+w*.6} ${bot+1.2} ${cx} ${bot+1.1} Q${cx-w*.6} ${bot+1.2} ${cx-w} ${cy-cu}Z`);
 if(o>.25){
  const iw=w*.82,it=top+.55,ib=bot+.2;
  R.mI.setAttribute('d',`M${cx-iw} ${cy-cu*.9} Q${cx} ${it-.3} ${cx+iw} ${cy-cu*.9} Q${cx} ${ib+.8} ${cx-iw} ${cy-cu*.9}Z`);
  R.mT.setAttribute('d',m.t>.5?`M${cx-iw*.8} ${it+.25} Q${cx} ${it-.1} ${cx+iw*.8} ${it+.25} L${cx+iw*.7} ${it+Math.min(1.1,o*.4)+.25} Q${cx} ${it+Math.min(1.1,o*.4)+.6} ${cx-iw*.7} ${it+Math.min(1.1,o*.4)+.25}Z`:'');
  R.mTo.setAttribute('d',`M${cx-iw*.5} ${ib+.3} Q${cx} ${ib-(m.tg?o*.8:o*.3)} ${cx+iw*.5} ${ib+.3}Z`);
 } else {
  // boca fechada com sorriso leve (linha dos lábios)
  R.mI.setAttribute('d',`M${cx-w*.85} ${cy-cu*.8} Q${cx} ${cy+.6+smile*.7} ${cx+w*.85} ${cy-cu*.8} Q${cx} ${cy+1.1+smile*.8} ${cx-w*.85} ${cy-cu*.8}Z`);
  R.mT.setAttribute('d','');R.mTo.setAttribute('d','');
 }
}
/* texto → visemas (heurística sem amplitude) */
function wordVisemes(word){
 const w=word.toLowerCase().replace(/[^a-z']/g,'');const out=[];
 const rules=[[/^(th)/,'TH'],[/^(ch|sh|j|g(?=[ei]))/,'S'],[/^(ee|ea|ie|y$)/,'I'],[/^(oo|ou|ew|u)/,'U'],[/^(ow|aw|au|o)/,'O'],[/^(ai|ay|a)/,'AA'],[/^(e)/,'E'],[/^(i)/,'I'],[/^[mbp]/,'MBP'],[/^[fv]/,'FV'],[/^[l]/,'L'],[/^[wr]/,'WR'],[/^[sztdnckgxqh]/,'S']];
 let i=0;while(i<w.length){let hit=false;for(const[re,v]of rules){const m=w.slice(i).match(re);if(m){if(!(v==='S'&&out[out.length-1]==='S'))out.push(v);i+=m[0].length;hit=true;break}}if(!hit)i++}
 return out.length?out:['E'];
}

/* ============ Estado global + config ============ */
const CFG=Object.assign({prov:'openai',key:'',model:'',azKey:'',azReg:'brazilsouth',sil:700,lvl:'B1',mode:'demo',diag:false,talk:(matchMedia('(pointer:coarse)').matches||/Android|iPhone|iPad/i.test(navigator.userAgent))?'ptt':'free'},JSON.parse(localStorage.getItem('sophiaCfg')||'{}'));
const save=()=>localStorage.setItem('sophiaCfg',JSON.stringify(CFG));
const S={state:'IDLE',t:0,running:false,
 // animação (valores atuais e alvos)
 gaze:{x:0,y:0,tx:0,ty:0,nextSacc:0}, blink:{next:1.5,phase:-1,dbl:false},
 nod:{start:-9,amp:0,dur:.7,last:-9}, lean:0,leanT:0, brow:{v:0,t:0,emp:0,empT:0}, tilt:0,tiltT:0, smile:.35,smileT:.35,
 mouth:{...VIS.rest}, visQ:[], speakEnd:0,
 // mic / turno
 energy:0, noise:.004, voiced:false, voicedSince:0, lastVoice:0, speechStart:0, pitch:0, pitchHist:[], lowPitchUntil:0,
 sileroSpeaking:false, finalTxt:'', interim:'', lastSTT:0, hesitation:0, bargeStart:0
};
const T=()=>S.t;

/* ============ 7 · UM SÓ RELÓGIO (requestAnimationFrame + AudioContext.currentTime) ============ */
let AC=null,analyser=null,buf=null,micStream=null;
const t0=performance.now();
function clockNow(){return AC&&AC.state==='running'?AC.currentTime:(performance.now()-t0)/1000}
function frame(){
 const now=clockNow(),dt=Math.min(.05,Math.max(0,now-(S.t||now)));S.t=now;
 micUpdate(now);         // 2 · energia/pitch/VAD
 turnUpdate(now);        // 4 · fim de turno, pausas, barge-in
 behaviorUpdate(now,dt); // 3 · acenos, olhar, piscar, inclinação, sobrancelhas
 mouthUpdate(now,dt);    // 6 · visemas
 render(now);
 requestAnimationFrame(frame);
}
const lerp=(a,b,k)=>a+(b-a)*k, ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2, rnd=(a,b)=>a+Math.random()*(b-a);

/* ============ 2 · OUVIR: microfone, energia, pitch, VAD ============ */
async function startMic(){
 AC=AC||new (window.AudioContext||window.webkitAudioContext)();await AC.resume();
 micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
 S.calibUntil=clockNow()+1;S.calib=[];
 const src=AC.createMediaStreamSource(micStream);analyser=AC.createAnalyser();analyser.fftSize=2048;src.connect(analyser);buf=new Float32Array(analyser.fftSize);
 // Silero VAD (rede neural no navegador). Se o CDN falhar, seguimos só com o VAD de energia.
 try{ if(window.vad&&window.vad.MicVAD){
   const mv=await window.vad.MicVAD.new({getStream:async()=>micStream,
     baseAssetPath:'https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.24/dist/',onnxWASMBasePath:'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/',
     positiveSpeechThreshold:.6,negativeSpeechThreshold:.35,minSpeechFrames:3,redemptionFrames:6,
     onSpeechStart:()=>{S.sileroSpeaking=true},onSpeechEnd:()=>{S.sileroSpeaking=false},onVADMisfire:()=>{S.sileroSpeaking=false}});
   mv.start();S.silero=mv;console.log('Silero VAD ativo');}
 }catch(e){console.warn('Silero VAD indisponível, usando VAD de energia',e)}
}
function yinPitch(b,sr){ // autocorrelação simples (80–400 Hz)
 let best=0,bestLag=0;const n=1024;
 for(let lag=Math.floor(sr/400);lag<Math.floor(sr/80);lag+=2){let s=0;for(let i=0;i<n;i+=2)s+=b[i]*b[i+lag];if(s>best){best=s;bestLag=lag}}
 return bestLag?sr/bestLag:0;
}
function micUpdate(now){
 let e=0;
 if(analyser){analyser.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];e=Math.sqrt(s/buf.length)}
 if(S.simUntil>now)e=Math.max(e,.05+.03*Math.sin(now*20)); // entrada simulada (testes)
 S.energy=e;

/* ============ 4 · FIM DE TURNO + 3 · reações durante a fala ============ */
function silenceMs(){const base=CFG.sil;return CFG.lvl==='A2'?base*1.3:CFG.lvl==='B2'?base*.85:base}
function turnUpdate(now){

 if(ptt&&S.pttFlush&&now>S.pttFlush){S.pttFlush=0;if(st==='LISTENING'){(S.finalTxt+' '+S.interim).trim()?endOfTurn():setState('ATTENDING')}}
 if(!ptt&&st==='ATTENDING'&&S.voiced&&now-S.voicedSince>.18)setState('LISTENING');
 if(st==='LISTENING'){
  const said=(S.finalTxt+' '+S.interim).trim();
  // ruído de fundo: se o STT não traz palavra nova há 1,2 s, o som que o VAD ainda ouve não conta como fala
  const wordsAt=S.lastWordsAt||0, voiceAct=(said&&now-wordsAt>1.2)?wordsAt:S.lastVoice;
  const lastAct=Math.max(voiceAct,said?wordsAt:S.lastSTT), sil=(now-lastAct)*1000;

  const incomplete=/\b(and|but|or|the|a|an|to|my|is|i|because|so|of|in|with|for|about|if|when|that|like|maybe|i think|you know|um+|uh+|er+)[,]?$/i.test(said);

  if(said&&wordsAt&&now-wordsAt>(incomplete?3:1.5)){S.waitFinal=0;endOfTurn();return}

  if(said&&AZREC&&!S.interim&&S.azFinalAt&&now-S.azFinalAt<4&&!S.voiced&&now-S.lastVoice>.25&&!incomplete){S.azFinalAt=0;S.waitFinal=0;endOfTurn();return}

function lidAmount(now){

/* ============ 6 · BOCA (fila de visemas no mesmo relógio) ============ */

function render(now){

/* ---- correções comuns de brasileiros (recast + dica de nativo, sem marcar frase certa como errada) ---- */
const FIX=[
 [/\bi have (\d+) years( old)?\b/i,m=>`I'm ${m[1]} years old`,'Em inglês a idade usa “to be”: I’m 30 years old.'],
 [/\bi am agree\b/i,()=>`I agree`,'“Agree” já é verbo: I agree.'],
 [/\b(i am|i'm) (working|living|studying) (here |in [a-z]+ )?(since|for) /i,m=>`I've been ${m[2]} ${m[3]||''}${m[4]} `,'Para algo que começou no passado e continua: I’ve been working here since…'],
 [/\bexplain me\b/i,()=>`explain to me`,'Explain + to: explain it to me.'],
 [/\bpeople is\b/i,()=>`people are`,'“People” é plural: people are.'],
 [/\bdepends of\b/i,()=>`depends on`,'It depends ON…'],
 [/\bwe still (waiting|working|trying)\b/i,m=>`we're still ${m[1]}`,'Faltou o verbo “to be”: we’re still waiting.'],
 [/\b(i|we|they) still (waiting|working|trying)\b/i,m=>`${m[1]==='i'?"I'm":m[1]+"'re"} still ${m[2]}`,'Faltou o “to be”.'],
 [/\bin the weekend\b/i,()=>`on the weekend`,'Nos EUA: ON the weekend.'],
 [/\bi like very much (\w+)/i,m=>`I really like ${m[1]}`,'Ordem natural: I really like…'],
 [/\bmake a question\b/i,()=>`ask a question`,'Ask a question (não “make”).'],
 [/\bi went to (home|there)\b/i,m=>`I went ${m[1]}`,'Home/there sem “to”: I went home.'],
 [/\bi am (\d+)\b(?! years)/i,null,null],
 [/\bmore (easy|cheap|fast|big|nice)\b/i,m=>`${{easy:'easier',cheap:'cheaper',fast:'faster',big:'bigger',nice:'nicer'}[m[1].toLowerCase()]}`,'Adjetivo curto: easier, cheaper, faster.'],
 [/\bi didn'?t went\b/i,()=>`I didn't go`,'Depois de didn’t, verbo na forma base: didn’t go.'],
 [/\b(he|she) (work|like|live|go|have)\b/i,m=>`${m[1]} ${m[2]==='have'?'has':m[2]==='go'?'goes':m[2]+'s'}`,'He/she → verbo com -s: she works.'],

 [/\bi want to (practice|improve) my english\b/i,'Perfeito. Variação natural: “I’d like to brush up on my English.”'],

 if(fx){repeat=fx.fixed.replace(/[.!?]*$/,'').split(/\s+/).length<=8?fx.fixed.replace(/[.!?]*$/,''):fx.good}
 else if(D.pastFix&&D.step===4){repeat=`Last weekend I ${D.pastFix}`}
 D.step++;D.last=reply.replace(/^(Oh|Ah|Got it)[^!.]*[!.]\s*/,'');D.pastFix=D.step===5?D.pastFix:null;
 return{reply,emph,repeat,tip:fx?fx.why:tip,pt};
}

/* ---- IA de verdade (OpenAI / Groq / xAI, chamada direto do navegador com a chave do usuário) ---- */
const HIST=[];
const SYS=`You are Sophia, a warm, casual English tutor for Brazilian adults (level {LVL}). Speak in 1-2 SHORT sentences (max 30 words), end with ONE follow-up question.
If the student made a real error, recast it naturally in your reply; never say "wrong"; never correct correct sentences. Their text comes from speech recognition and may have misheard words: infer what they meant.
FORMAT: first your spoken reply as plain text. Then a line with ### and then one line of JSON:
{"heard":"their message with recognition errors fixed (keep their grammar mistakes)","emph":"phrase you recast or null","tip":"short tip in Brazilian Portuguese or null","repeat":"<=8 words to repeat, only if there was an error, else null","pt":"short Portuguese translation of your reply"}`;
const PROV={openai:{u:'https://api.openai.com/v1',m:'gpt-4o-mini',n:'OpenAI'},groq:{u:'https://api.groq.com/openai/v1',m:'llama-3.3-70b-versatile',n:'Groq'},xai:{u:'https://api.x.ai/v1',m:'grok-4.20-0309-non-reasoning',n:'xAI (Grok)'}};
const FAST={xai:['grok-4.20-0309-non-reasoning','grok-4-1-fast-non-reasoning','grok-4-fast-non-reasoning','grok-3-mini','grok-4.3','grok-3'],openai:['gpt-4o-mini','gpt-4.1-mini'],groq:['llama-3.3-70b-versatile','llama-3.1-8b-instant']};
const llmModel=()=>CFG.model||(CFG.autoModel||{})[CFG.prov]||PROV[CFG.prov].m;
async function llmErrInfo(res){const pn=PROV[CFG.prov].n;let det='';
 try{const t=await res.text();try{const j=JSON.parse(t);const e=j.error;det=typeof e==='string'?e:(e&&(e.message||JSON.stringify(e)))||j.message||j.code||t}catch(_){det=t}}catch(_){}
 det=String(det||'').slice(0,220);
 const kind=(res.status===401||res.status===403||/incorrect api key|invalid api key|api key (is )?(invalid|incorrect|not valid)|unauthori[sz]ed/i.test(det))?'key'
  :(res.status===404||/model/i.test(det)&&/(not|exist|found|access|invalid|unknown|support)/i.test(det))?'model'
  :(res.status===402||res.status===429||/credit|balance|spending|quota|billing|payment/i.test(det))?'credits':'other';
 const msg=kind==='key'?`chave da ${pn} recusada (${res.status}): ${det}`:kind==='model'?`modelo não aceito pela ${pn} (${res.status}): ${det}`:kind==='credits'?`sem créditos/limite na ${pn} (${res.status}): ${det}`:`${pn} respondeu ${res.status}: ${det||'sem detalhes'}`;
 return{kind,status:res.status,det,msg}}
async function pickModel(){ // lista os modelos da conta e escolhe um rápido; guarda a escolha
 const res=await fetch(PROV[CFG.prov].u+'/models',{headers:{Authorization:'Bearer '+CFG.key}});
 if(!res.ok)throw new Error((await llmErrInfo(res)).msg);
 const ids=((await res.json()).data||[]).map(m=>m.id);
 const pref=FAST[CFG.prov]||[];
 const id=pref.find(x=>ids.includes(x))||ids.find(x=>/fast.*non-reasoning|non-reasoning|mini|fast/i.test(x)&&!/image|video|voice|vision|tts|embed/i.test(x))||ids.find(x=>/grok|gpt|llama/i.test(x)&&!/image|video|voice|vision|tts|embed/i.test(x));
 if(!id)throw new Error('nenhum modelo de texto disponível na conta ('+ids.slice(0,5).join(', ')+')');
 CFG.autoModel=Object.assign({},CFG.autoModel,{[CFG.prov]:id});save();diag('err','modelo escolhido automaticamente: '+id);return id}
async function llmCall(messages,{onDelta,stream=true}={}){
 let minimal=false,picked=false;
 for(let attempt=0;attempt<3;attempt++){
  const model=llmModel();const body={model,messages,stream};
  if(!minimal){body.temperature=.7;if(CFG.prov!=='xai')body.max_tokens=220}
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),15000);
  let res;try{res=await fetch(PROV[CFG.prov].u+'/chat/completions',{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+CFG.key},body:JSON.stringify(body)})}
  catch(e){clearTimeout(to);throw new Error(e.name==='AbortError'?'tempo esgotado (15 s)':'sem conexão com a '+PROV[CFG.prov].n+' ('+e.message+')')}
  if(!res.ok){clearTimeout(to);const er=await llmErrInfo(res);console.warn('LLM',er);
   if(er.kind==='model'&&!picked&&!CFG.model){picked=true;await pickModel();continue}
   if(er.kind==='other'&&res.status===400&&!minimal){minimal=true;continue} // tira parâmetros opcionais e tenta de novo
   throw new Error(er.msg)}
  let full='';
  if(stream&&/event-stream/.test(res.headers.get('content-type')||'')&&res.body){
   const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
   for(;;){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith('data:'))continue;const d=line.slice(5).trim();if(d==='[DONE]')continue;
     try{const j=JSON.parse(d);const c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(c){full+=c;onDelta&&onDelta(full)}}catch(_){}}}
  } else {const t=await res.text();
   if(/^\s*data:/.test(t)){t.split('\n').forEach(l=>{l=l.trim();if(!l.startsWith('data:'))return;try{const j=JSON.parse(l.slice(5));const c=j.choices[0].delta.content;if(c)full+=c}catch(_){}})}
   else{const j=JSON.parse(t);full=(j.choices&&j.choices[0].message.content)||''}
   onDelta&&onDelta(full)}
  clearTimeout(to);return{full,model};
 }
 throw new Error('a '+PROV[CFG.prov].n+' recusou o pedido');
}
function parseLLM(full){
 const nul=v=>v&&v!=='null'?v:null;let reply=full,meta={};
 const k=full.indexOf('###');
 if(k>=0){reply=full.slice(0,k);const m=full.slice(k+3);try{meta=JSON.parse(m.slice(m.indexOf('{'),m.lastIndexOf('}')+1))}catch(_){}}
 else if(full.trim().startsWith('{')){try{meta=JSON.parse(full.slice(full.indexOf('{'),full.lastIndexOf('}')+1));reply=meta.reply||''}catch(_){}}
 reply=reply.replace(/^\s*(reply|sophia)\s*:\s*/i,'').replace(/["“”]/g,'').trim();
 return{heard:nul(meta.heard),reply,emph:nul(meta.emph),tip:nul(meta.tip),repeat:nul(meta.repeat),pt:nul(meta.pt)}}
async function llmReply(txt,onSentence){
 HIST.push({role:'user',content:txt});
 let sent=0;
 const onDelta=full=>{ if(!onSentence||full.trim().startsWith('{'))return;
   let vis=full;const k=vis.indexOf('#');if(k>=0)vis=vis.slice(0,k); // para no ### (metadados)
   const rest=vis.slice(sent);const m=rest.match(/^[\s\S]*?[.!?]+["')]*(?=\s)/); // frase completa seguida de espaço
   if(m){sent+=m[0].length;onSentence(m[0].replace(/["“”]/g,''));onDelta(full)} };
 const{full}=await llmCall([{role:'system',content:SYS.replace('{LVL}',CFG.lvl)},...HIST.slice(-12)],{onDelta});
 const r=parseLLM(full);
 if(onSentence&&!full.trim().startsWith('{')){const tail=r.reply.slice(Math.min(sent,r.reply.length)).trim();if(sent<r.reply.length&&tail)onSentence(tail)}
 HIST.push({role:'assistant',content:r.reply});
 if(!r.reply)throw new Error('resposta vazia da '+PROV[CFG.prov].n);
 return r;
}

/* ============ UI: mensagens, dica, "Repeat after me" com palavras ficando verdes ============ */
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function addMsg(who,text,emph,pt){const d=document.createElement('div');d.className='msg '+who;d.dataset.sent=text;renderMsg(d,text,emph,pt);$('log').appendChild(d);$('log').scrollTop=1e9;return d}
function renderMsg(d,text,emph,pt){let h=esc(text);
 if(emph){const i=h.toLowerCase().indexOf(emph.toLowerCase());if(i>=0)h=h.slice(0,i)+'<span class="emph">'+h.slice(i,i+emph.length)+'</span>'+h.slice(i+emph.length)}
 d.innerHTML=h+(pt?`<span class="pt">${esc(pt)}</span>`:'');$('log').scrollTop=1e9}
function addTip(t){const d=document.createElement('div');d.className='tip';d.innerHTML='<b>💡 Dica de nativo</b>'+esc(t);$('log').appendChild(d);$('log').scrollTop=1e9}
let REP=null;
function addRepeat(p){const d=document.createElement('div');d.className='rep';const ws=p.split(/\s+/);
 d.innerHTML='<b>🔁 Repita comigo</b>'+ws.map(w=>`<span>${esc(w)}</span>`).join(' ');$('log').appendChild(d);$('log').scrollTop=1e9;
 REP={el:d,words:ws.map(w=>norm(w)),spans:[...d.querySelectorAll('span')],ok:new Set(),done:false}}
const ALIAS={"i'm":['im','i am'],"we're":['were','we are'],"i've":['ive','i have'],"didn't":['didnt','did not']};
function checkRepeat(said){
 if(!REP||REP.done)return;const toks=norm(said).split(' ');const joined=' '+toks.join(' ')+' ';
 REP.words.forEach((w,i)=>{const al=[w,w.replace(/'/g,''),...(ALIAS[w]||[])];if(al.some(a=>joined.includes(' '+a+' '))){REP.ok.add(i);REP.spans[i].classList.add('ok')}});
 if(REP.ok.size===REP.words.length){REP.done=true;REP.el.insertAdjacentHTML('beforeend','<span class="done">✓ Perfeito!</span>');S.praise=T()+1.5;nod(1.2)}
}
function note(t){note.last=t;$('err').textContent=t}

/* ============ Controles ============ */
function start(){ // parte SÍNCRONA dentro do toque: destrava áudio e inicia o reconhecimento no gesto
 note('');$('btnStart').hidden=true;$('btnStop').hidden=false;S.running=true;
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(_){}
 if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)} // destrava áudio no iOS
 const useAz=!!CFG.azKey;
 S.engine=useAz?'azure':'web';
 if(!useAz&&CFG.talk==='free')startSTT(); // Web Speech: start() no próprio gesto (no aperte-para-falar, inicia ao apertar)
 startAsync(useAz);
}
async function startAsync(useAz){
 // Celular + Web Speech: NÃO abrimos getUserMedia/VAD — o reconhecedor do Chrome precisa do microfone só para ele.
 const needMic=useAz||!IS_MOBILE;
 if(needMic){try{await startMic();diag('mic','aberto'+(S.silero?' + Silero VAD':' (VAD de energia)')+', echoCancellation')}
   catch(e){diag('mic','bloqueado ('+e.name+')');diag('err','getUserMedia: '+e.name);note('Microfone bloqueado ('+e.name+'). '+MIC_HELP)}}
 else diag('mic','usado pelo reconhecedor do navegador (sem VAD no celular)');
 if(useAz){diag('stt','Azure (carregando SDK)');const ok=await loadAzureSDK();
   if(!ok){diag('stt','Azure indisponível');note('Azure STT indisponível — tentando o reconhecedor do navegador.');S.engine='web';if((!micStream||!IS_MOBILE)&&CFG.talk==='free')startSTT()} else{startAzureSTT();azWarm()}}
 D.step=0;HIST.length=0;S.state='IDLE';
 const hello=CFG.mode==='llm'&&CFG.key?"Hi! I'm Sophia, your English buddy. What's your name, and how's your day going?":"Hi! I'm Sophia, your English buddy. What's your name?";
 if(CFG.mode==='llm')HIST.push({role:'assistant',content:hello});
 setState('THINKING');await new Promise(z=>setTimeout(z,400));
 deliver({reply:hello,pt:'Oi! Eu sou a Sophia. Qual é o seu nome?'});
}
function stop(){S.running=false;S.ptt=false;S.pttFlush=0;recOn=false;try{REC&&REC.stop()}catch(_){}try{speechSynthesis.cancel()}catch(_){}
 stopAzureSTT();
 if(S.cancelAz)S.cancelAz();speakToken++;
 if(micStream)micStream.getTracks().forEach(t=>t.stop());micStream=null;if(S.silero)try{S.silero.pause()}catch(_){};S.silero=null;analyser=null;setState('IDLE');$('btnStart').hidden=false;$('btnStop').hidden=true;diag('mic','fechado')}
$('btnStart').onclick=()=>{start();talkUI()};$('btnStop').onclick=()=>{stop();talkUI()};
/* ============ Aperte-para-falar (padrão no celular) + Mãos livres ============ */
function isPTT(){return S.running&&CFG.talk==='ptt'}
function talkUI(){const run=S.running,ptt=CFG.talk==='ptt';$('freeTgl').checked=!ptt;
 $('btnTalk').hidden=!(run&&ptt);$('btnDone').hidden=!(run&&!ptt);
 $('btnTalk').classList.toggle('held',!!S.ptt);$('btnTalk').setAttribute('aria-pressed',S.ptt?'true':'false');
 $('btnTalk').textContent=S.ptt?(S.pttToggle?'✓ Toque para enviar':'🔴 Falando… solte para enviar'):'🎙️ Segure para falar';
 $('talkHint').textContent=ptt?'segure, fale e solte (ou toque uma vez para abrir e outra para enviar)':'ela responde quando você termina; “Terminei” encerra na hora';
 diag('stt',DG.stt.replace(/ · modo.*$/,'')+' · modo: '+(ptt?'aperte-para-falar':'mãos livres'))}
function pttDown(ev){ if(ev){ev.preventDefault();if(ev.pointerId!=null)try{ev.target.setPointerCapture(ev.pointerId)}catch(_){}} if(!S.running)return;
 if(S.ptt){if(S.pttToggle)pttUp(null,true);return} // 2º toque no modo toque-para-alternar = enviar
 S.ptt=true;S.pttToggle=false;S.pttDownWall=performance.now();S.pttAt=T();
 if(S.state==='SPEAKING')bargeIn('ptt'); // apertar enquanto ela fala = interromper
 S.pttBase=S.interim||'';S.finalTxt='';S.interim='';S.lastWords='';S.lastWordsAt=0;S.pttFlush=0;$('capFinal').textContent='';$('capInt').textContent='';
 S.state==='LISTENING'?(S.speechStart=T()):setState('LISTENING');
 if(S.engine==='web'&&!recOn)startSTT(); // dentro do gesto (pointerdown) → Android aceita
 talkUI()}
function pttUp(ev,force){ if(!S.ptt)return; const held=performance.now()-S.pttDownWall;
 if(!force&&held<350){S.pttToggle=true;talkUI();return} // toque rápido = fica aberto até o próximo toque (acessibilidade)
 S.ptt=false;S.pttToggle=false;talkUI();
 if(S.engine==='web'){recOn=false;try{REC&&REC.stop()}catch(_){}}
 if(S.state!=='LISTENING')return;
 const said=(S.finalTxt+' '+S.interim).trim();
 if(said)endOfTurn(); // sem esperar silêncio: final + parcial mais recente
 else S.pttFlush=T()+.9; // nada reconhecido ainda: aguarda até 0,9 s pelo texto
}

$('btnTalk').addEventListener('pointerup',e=>pttUp(e));$('btnTalk').addEventListener('pointercancel',e=>pttUp(e,true));
$('btnTalk').addEventListener('contextmenu',e=>e.preventDefault());
$('btnTalk').addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();pttDown()}});
$('btnTalk').addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();pttUp(null)}});
$('btnDone').onclick=()=>{if(S.state==='LISTENING'&&(S.finalTxt+' '+S.interim).trim())endOfTurn()};
$('freeTgl').onchange=e=>{CFG.talk=e.target.checked?'free':'ptt';save();S.ptt=false;S.pttFlush=0;
 if(S.running&&S.engine==='web'){ if(CFG.talk==='free'&&!recOn)startSTT(); else if(CFG.talk==='ptt'){recOn=false;try{REC&&REC.stop()}catch(_){}} }
 if(S.running&&S.state==='ATTENDING')setState('IDLE'),setState('ATTENDING');
 talkUI()};

 catch(e){out.textContent='❌ '+e.message;diag('err','Teste IA: '+e.message)}
