<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sophia v3 – boneco SVG com lip sync ao vivo</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
:root{--navy:#1b2547;--cream:#f4ead5;--yellow:#f2b632;--red:#c8102e}
*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:system-ui,sans-serif;color:var(--navy);display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-size:17px;margin:4px 0 10px}
#stage{width:360px;height:360px;border-radius:50%;border:10px solid var(--yellow);overflow:hidden;box-shadow:6px 6px 0 var(--navy);background:var(--cream)}
#stage svg{width:100%;height:100%;display:block;overflow:visible}
#sophiaStatus{margin:10px 0 6px;font-weight:600;min-height:20px}#sophiaCap{min-height:22px;font-size:15px;max-width:420px;text-align:center}
#sophiaCap b{background:var(--yellow)}
.panel{width:100%;max-width:440px;background:#fff8ea;border:3px solid var(--navy);box-shadow:4px 4px 0 var(--navy);padding:10px;margin-top:10px}
label{font-weight:700;font-size:14px}textarea,input{width:100%;font:inherit;border:2px solid var(--navy);padding:6px;margin:4px 0}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
button{font:inherit;font-size:14px;border:2px solid var(--navy);background:var(--yellow);color:var(--navy);padding:6px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--navy)}
button.red{background:var(--red);color:#fff}button.navy{background:var(--navy);color:var(--cream)}
small{opacity:.75}details summary{cursor:pointer;font-weight:700}
</style></head><body>
<h1>Sophia v3 · boneco SVG ao vivo</h1>
<div id="stage"></div>
<div id="sophiaStatus">carregando…</div><div id="sophiaCap"></div>
<div class="panel">
 <label for="txt">Sophia diz:</label>
 <textarea id="txt" rows="2">Hi! I'm Sophia. Let's practice your English together. How was your weekend?</textarea>
 <div class="row"><button class="red" id="bSpeak">▶ Falar</button><button id="bStop">■ Parar</button><button class="navy" id="bConv">💬 Mini-conversa</button></div>
 <div class="row"><button data-s="idle">parada</button><button data-s="ouvindo">ouvindo</button><button data-s="pensando">pensando</button><button data-s="comemorando">comemorando</button><button data-s="naoouvi">não ouvi</button></div>
 <div class="row" id="mouthBtns"><small>bocas:</small></div>
</div>
<div class="panel"><details><summary>⚙ Configurações de voz (Azure, opcional)</summary>
 <p><small>Sem chave, a demo usa a voz do navegador + aproximação de fonemas. Com chave Azure Speech, usa visemas reais (VisemeReceived). A chave fica só no localStorage deste navegador.</small></p>
 <label>Chave Azure Speech</label><input id="azKey" type="password" autocomplete="off">
 <label>Região (ex.: brazilsouth, eastus)</label><input id="azReg">
 <label>Voz</label><input id="azVoice" value="en-US-JennyNeural">
 <div class="row"><button id="azSave">Salvar</button><button id="azClear">Apagar</button><small id="azInfo"></small></div>
</details></div>
<script src="sophia.js"></script>
</body></html>
